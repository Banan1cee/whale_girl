name: tests

# 只跑测试与编译，不需要任何密钥、微信或网络：
# 所有联网、发消息、看图、API Key 相关用例在 tests/ 里都是 mock 的。
#
# 只留一个 Windows job：GitHub 的 windows-latest 并发槽很紧，每个 PR 开两个
# Windows 任务时经常排队 15 分钟被取消。Node/Python 自检和启动器回归合成一个
# job 顺序跑（约 4 分钟），换取「能真正排上队」。gate 仍只做汇总，名字还是
# 「测试 / 分层 / 编译」，main 的必需检查引用的是它。
on:
  push:
    branches: [main, feature4]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

env:
  # 统一 UTF-8：CI 机器是英文区域（cp1252），中文断言消息和文件读写都靠这个。
  PYTHONUTF8: '1'
  PYTHONIOENCODING: utf-8
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  checks:
    name: 单元与启动器回归
    # 必须是 Windows：Node 回归会启动 Python 并按 Windows 语义探测路径，
    # 启动器还是 WPF net10.0-windows。
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      # 不能低于 22：npm test 里的 node --test "tests/*.test.js" 的 glob 要 21+ 才会展开。
      # 也不能开 setup-node 的 cache：项目零依赖，没有 lock 文件。
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # 镜像一般自带 .NET 10；每次无条件下载 SDK 要 300MB、约 37 秒，
      # 所以先看本机有没有，缺了才装。版本线仍是 10.0.x。
      - name: 检查 .NET 10 SDK
        id: sdk
        shell: pwsh
        run: |
          $found = @()
          try { $found = @(dotnet --list-sdks 2>$null | Where-Object { $_ -match '^10\.0\.' }) } catch {}
          $has = ($found.Count -gt 0).ToString().ToLower()
          Write-Output "has10=$has"
          "has10=$has" >> $env:GITHUB_OUTPUT

      - uses: actions/setup-dotnet@v4
        if: steps.sdk.outputs.has10 != 'true'
        with:
          dotnet-version: '10.0.x'

      # 安装只发生在临时 CI 镜像；本地 runner 只核验依赖，不擅自安装。
      - name: Python 依赖（Node / Python 桥接回归）
        if: always()
        shell: pwsh
        run: python -m pip install --disable-pip-version-check --quiet pillow cryptography requests
      - name: 准备 actionlint（检查由共用任务执行）
        if: always()
        shell: pwsh
        run: |
          $ver = '1.7.12'
          $name = "actionlint_${ver}_windows_amd64.zip"
          $urls = @(
            "https://github.com/rhysd/actionlint/releases/download/v$ver/$name",
            "https://gh-proxy.com/https://github.com/rhysd/actionlint/releases/download/v$ver/$name",
            "https://ghproxy.net/https://github.com/rhysd/actionlint/releases/download/v$ver/$name"
          )
          $zip = Join-Path $env:RUNNER_TEMP "actionlint-$ver.zip"
          $dir = Join-Path $env:RUNNER_TEMP "actionlint-$ver"
          $downloaded = $false
          foreach ($url in $urls) {
            for ($attempt = 1; $attempt -le 2; $attempt++) {
              if (Test-Path $zip) { Remove-Item $zip -Force }
              & curl.exe -L --fail --silent --show-error --retry 1 --connect-timeout 20 --max-time 180 -o $zip $url
              if ($LASTEXITCODE -eq 0 -and (Test-Path $zip) -and (Get-Item $zip).Length -gt 0) {
                $downloaded = $true
                break
              }
              Write-Output "actionlint 下载失败（第 $attempt 次）：$url"
              if ($attempt -lt 2) { Start-Sleep -Seconds 5 }
            }
            if ($downloaded) { break }
          }
          if (-not $downloaded) {
            # 未检查不能报告成功；保留失败供 always 汇总。
            Write-Output '::error title=actionlint::下载 actionlint 失败，workflow 静态检查未完成'
            exit 1
          }
          try { Expand-Archive -Path $zip -DestinationPath $dir -Force }
          catch {
            Write-Output "::error title=actionlint::actionlint 包解压失败，静态检查未完成：$($_.Exception.Message)"
            exit 1
          }
          $actionlint = Join-Path $dir 'actionlint.exe'
          "ACTIONLINT_PATH=$actionlint" >> $env:GITHUB_ENV

      - name: 环境版本
        if: always()
        shell: pwsh
        run: node scripts/test-tasks.js --task environment --report artifacts/test-tasks/environment.json

      - name: workflow 静态检查（actionlint）
        if: always()
        shell: pwsh
        run: node scripts/test-tasks.js --task actionlint --report artifacts/test-tasks/actionlint.json

      - name: 分层依赖（谁可以 require 谁）
        if: always()
        shell: pwsh
        run: node scripts/test-tasks.js --task layers --report artifacts/test-tasks/layers.json

      - name: 发布自检
        if: always()
        shell: pwsh
        run: node scripts/test-tasks.js --task release-check --report artifacts/test-tasks/release-check.json

      - name: 隐私扫描（文本 + 二进制）
        if: always()
        shell: pwsh
        run: node scripts/test-tasks.js --task privacy --report artifacts/test-tasks/privacy.json

      - name: Python 测试依赖核验
        if: always()
        shell: pwsh
        run: node scripts/test-tasks.js --task python-dependencies --report artifacts/test-tasks/python-dependencies.json

      - name: Python 测试声明完整性
        if: always()
        shell: pwsh
        run: node scripts/test-tasks.js --task python-test-audit --report artifacts/test-tasks/python-test-audit.json

      - name: Node 单元测试（零 npm 依赖，含 Python 桥接回归）
        if: always()
        shell: pwsh
        run: node scripts/test-tasks.js --task node-tests --report artifacts/test-tasks/node-tests.json

      - name: Python 单元测试
        if: always()
        shell: pwsh
        run: node scripts/test-tasks.js --task python-tests --report artifacts/test-tasks/python-tests.json

      - name: 桥接自检（零焦点发送 / 消息调度）
        if: always()
        shell: pwsh
        run: node scripts/test-tasks.js --task bridge-selftests --report artifacts/test-tasks/bridge-selftests.json

      - name: 启动冒烟（--doctor）
        if: always()
        shell: pwsh
        run: node scripts/test-tasks.js --task doctor --report artifacts/test-tasks/doctor.json

      - name: 启动器编译
        if: always()
        shell: pwsh
        run: node scripts/test-tasks.js --task launcher-build --report artifacts/test-tasks/launcher-build.json

      - name: 更新摘要解析与兼容回归
        if: always()
        shell: pwsh
        run: node scripts/test-tasks.js --task update-checks --report artifacts/test-tasks/update-checks.json

      - name: 语音实验开关与发送回归（模拟接口，不发消息）
        if: always()
        shell: pwsh
        timeout-minutes: 3
        run: node scripts/test-tasks.js --task voice-send --report artifacts/test-tasks/voice-send.json

      - name: 插件安装与运行回归
        if: always()
        shell: pwsh
        run: node scripts/test-tasks.js --task plugin-market --report artifacts/test-tasks/plugin-market.json

      - name: 启动器进程生命周期回归（模拟桥接）
        if: always()
        shell: pwsh
        run: node scripts/test-tasks.js --task launcher-lifecycle --report artifacts/test-tasks/launcher-lifecycle.json

  # 必需检查名保持不变：分支保护引用的是「测试 / 分层 / 编译」，
  # 所以用这个只做汇总的 job 收口，子 job 的名字可以随便改。
  gate:
    name: 测试 / 分层 / 编译
    needs: [checks]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 汇总子任务结果
        run: |
          echo "单元与启动器回归: ${{ needs.checks.result }}"
          if [ "${{ needs.checks.result }}" != "success" ]; then
            echo "::error title=测试 / 分层 / 编译::单元与启动器回归未通过，见上面的 checks job"
            exit 1
          fi
