name: pages

# 静态官网：把 website/ 作为 GitHub Pages 站点发布。
# GitHub Pages 的「Deploy from a branch」只支持仓库根目录或 /docs，
# 不能直接选 website/，所以这里用官方 Actions 上传 artifact。
# 使用前在仓库 Settings → Pages → Build and deployment 里把 Source 设为 GitHub Actions。

on:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - '.github/workflows/pages.yml'
      - 'scripts/render-website-releases.js'
      - 'scripts/build-website.js'
      - 'scripts/fetch-website-data.js'
      - 'scripts/wait-pages-artifact.js'
      - 'scripts/website-support.js'
  release:
    types: [published, edited, unpublished, deleted]
  schedule:
    # 旧维护分支没有此工作流时，用定时部署补齐。
    - cron: '23 2 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  refresh-on-release:
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      # Release 事件的 ref 是标签，Pages 环境只允许 main 部署。
      - run: gh workflow run pages.yml --ref main
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}

  deploy:
    if: github.event_name != 'release' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      actions: read
      pages: write
      id-token: write
    env:
      # 重跑使用独立名称，避免同一次 run 的旧产物参与本次部署。
      PAGES_ARTIFACT_NAME: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: 获取完整发行历史与插件目录快照
        run: |
          node scripts/fetch-website-data.js "$RUNNER_TEMP/website-data.json"
        env:
          GH_TOKEN: ${{ github.token }}

      - name: 校验并生成官网所有页面
        run: |
          node tests/website-hub.test.js
          node tests/website-experience.test.js
          node tests/website-polish.test.js
          node scripts/build-website.js "$RUNNER_TEMP/website-data.json" "$RUNNER_TEMP/site"

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          name: ${{ env.PAGES_ARTIFACT_NAME }}
          path: ${{ runner.temp }}/site

      - name: 等待 Pages 产物可见
        run: node scripts/wait-pages-artifact.js
        env:
          GH_TOKEN: ${{ github.token }}

      - id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: ${{ env.PAGES_ARTIFACT_NAME }}
